      - '#a6e3a1'
      - '#f9e2af'
      - '#89b4fa'
      - '#f5c2e7'
      - '#94e2d5'
      - '#a6adc8'
  customColorSchemes: []
  warnOnMultilinePaste: true
  searchRegexAlwaysEnabled: false
  searchOptions:
    regex: false
    wholeWord: false
    caseSensitive: false
  detectProgress: true
  scrollbackLines: 25000
  drawBoldTextInBrightColors: true
  sixel: true
  minimumContrastRatio: 4
  paletteGenerate: false
  paletteHarmonious: false
  replaceNewlinesWithSpacesOnPaste: false
  trimWhitespaceOnPaste: true
  font: Hack Nerd Font
  autoOpen: true
  useConPTY: true
  environment: {}
  setComSpec: false
  profile: local:default
  showBuiltinProfiles: true
  showRecentProfiles: 3
  paneResizeStep: 0.1
  focusFollowsMouse: false
  identification: null
ssh:
  warnOnClose: false
  winSCPPath: null
  agentType: auto
  agentPath: null
  x11Display: null
  knownHosts:
    - host: 192.168.22.63
      port: 22
      type: ecdsa-sha2-nistp256
      digest: ZSNpgjd7hn3oQoXw5WbUqZ6n+7nmc1bLmtRQ8k4NYHY=
  verifyHostKeys: true
configSync:
  configID: null
  auto: false
  parts:
    hotkeys: true
    appearance: true
    vault: true
clickableLinks:
  modifier: null
accessibility:
  animations: true
appearance:
  dock: 'off'
  dockScreen: current
  dockFill: 0.5
  dockSpace: 1
  dockHideOnBlur: false
  dockAlwaysOnTop: true
  flexTabs: false
  tabsLocation: top
  tabsInFullscreen: false
  cycleTabs: true
  theme: Follow the color scheme
  frame: thin
  css: '/* * { color: blue !important; } */'
  opacity: 1
  vibrancy: false
  vibrancyType: blur
  lastTabClosesWindow: false
  spaciness: 1
  colorSchemeMode: dark
profiles: []
groups: []
profileDefaults:
  ssh:
    disableDynamicTitle: true
recoverTabs: true
enableAnalytics: false
enableWelcomeTab: false
electronFlags:
  - - force_discrete_gpu
    - '0'
enableAutomaticUpdates: false
hideTray: false
version: 8
vault: null
encrypted: false
enableExperimentalFeatures: false
commandBlacklist: []
providerBlacklist: []
profileBlacklist: []
hacks:
  disableGPU: false
  disableVibrancyWhileDragging: false
  enableFluentBackground: false
  globalHotkey: null
defaultQuickConnectProvider: ssh
pluginBlacklist: []
