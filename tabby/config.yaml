terminal:
  frontend: xterm-webgl
  fontSize: 14
  fontWeight: 400
  fontWeightBold: 700
  fallbackFont: Menlo
  linePadding: 0
  bell: 'off'
  bracketedPaste: true
  background: theme
  ligatures: false
  cursor: block
  cursorBlink: false
  hideTabIndex: false
  showTabProfileIcon: false
  hideCloseButton: false
  hideTabOptionsButton: false
  rightClick: menu
  pasteOnMiddleClick: true
  copyOnSelect: false
  copyAsHTML: true
  scrollOnInput: true
  altIsMeta: false
  wordSeparator: ' ()[]{}''"'
  colorScheme:
    name: Catppuccin Mocha
    foreground: '#cdd6f4'
    background: '#1e1e2e'
    cursor: '#f5e0dc'
    colors:
      - '#45475a'
      - '#f38ba8'
      - '#a6e3a1'
      - '#f9e2af'
      - '#89b4fa'
      - '#f5c2e7'
      - '#94e2d5'
      - '#bac2de'
      - '#585b70'
      - '#f38ba8'
      - '#a6e3a1'
      - '#f9e2af'
      - '#89b4fa'
      - '#f5c2e7'
      - '#94e2d5'
      - '#a6adc8'
  lightColorScheme:
    name: Catppuccin Mocha
    foreground: '#cdd6f4'
    background: '#1e1e2e'
    cursor: '#f5e0dc'
    colors:
      - '#45475a'
      - '#f38ba8'
      - '#a6e3a1'
      - '#f9e2af'
      - '#89b4fa'
      - '#f5c2e7'
      - '#94e2d5'
